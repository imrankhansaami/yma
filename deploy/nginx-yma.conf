# ============================================================
# YMA Bouncy Castle - nginx virtual host
#
# Only ONE upstream is required: Next.js on 127.0.0.1:3000.
# The Next.js route handler at frontend/src/app/api/v1/[...path]/route.ts
# proxies API calls to the Express backend on 127.0.0.1:8001, so port 8001
# never has to be reachable from the internet.
#
# Replace "example.com" below if your domain differs.
# Adjust the ssl_certificate paths to match where ServerAvatar installed
# the certificate (check the SSL tab for the exact path).
#
# Install (manual path):
#   sudo cp deploy/nginx-yma.conf /etc/nginx/sites-available/yma.conf
#   sudo ln -sf /etc/nginx/sites-available/yma.conf /etc/nginx/sites-enabled/yma.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Leave this reachable over plain HTTP or certificate renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---- HTTPS: www -> apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# ---- HTTPS: main site ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads go straight to Cloudinary, so this only has to cover JSON.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # ---- All traffic -> Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js streams SSR output; do not buffer it.
        proxy_buffering off;

        # Cold ISR / sitemap generation can be slow on the first hit.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# NOTE on the "http2 on;" directive:
#   It requires nginx >= 1.25.1. If `nginx -t` reports an unknown directive,
#   delete those two lines and change the two listen lines to:
#       listen 443 ssl http2;
#       listen [::]:443 ssl http2;
